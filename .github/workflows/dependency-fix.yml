name: Corrección segura de dependencias Node

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, gd, zip, intl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Preparar Laravel y Wayfinder
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form --skip-database

      - name: Actualizar sólo a parches compatibles
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only
          status=$?
          set -e
          # npm audit devuelve 1 si quedan advisories aunque los high/critical
          # ya se hayan corregido. Sólo aceptamos 0/1; errores reales (>1) fallan.
          if (( status > 1 )); then
            exit "$status"
          fi

      - name: Instalar lock corregido
        run: npm ci

      - name: Verificar vulnerabilidades de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run types:check

      - name: Build
        run: npm run build

      - name: Guardar lockfile corregido
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No hubo cambios en dependencias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Actualiza dependencias vulnerables compatibles"
          git push origin HEAD:main
