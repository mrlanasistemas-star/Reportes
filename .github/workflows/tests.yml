name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (producción)
        run: composer audit --no-interaction --locked --no-dev

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generar rutas y acciones Wayfinder
        run: touch database/database.sqlite
          php artisan migrate --force
          php artisan wayfinder:generate --with-form

      - name: Frontend lint
        run: npm run lint:check

      - name: Frontend typecheck
        run: npm run types:check

      - name: Build Assets
        run: npm run build

      - name: Tests
        run: ./vendor/bin/pest


  radiography-mysql:
    name: Radiografía en MySQL 8.4 real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reportes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, gd, zip, intl, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno MySQL aislado
        shell: bash
        run: |
          cp .env.testing.mysql.example .env.testing.mysql
          sed -i 's/^DB_TEST_PASSWORD=.*/DB_TEST_PASSWORD=root/' .env.testing.mysql
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=/' .env.testing.mysql
          KEY=$(php -r "echo 'base64:'.base64_encode(random_bytes(32));")
          sed -i "s|^APP_KEY=.*|APP_KEY=$KEY|" .env.testing.mysql

      - name: Esperar MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL no respondió"
          exit 1

      - name: Pipeline de radiografía contra MySQL real
        run: ./vendor/bin/pest --configuration=phpunit.integration.xml tests/Integration/RadiographyMysqlPipelineTest.php


  browser-okr:
    name: OKR en navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Prueba real de edición OKR
        run: npm run test:browser:okr
