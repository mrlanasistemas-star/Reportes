name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Preparar Laravel y Wayfinder
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form --skip-database

      - name: Detectar base del cambio
        id: base
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE_PUSH: ${{ github.event.before }}
        run: |
          if [[ "$EVENTO" == "pull_request" ]]; then
            BASE="$BASE_PR"
          else
            BASE="$BEFORE_PUSH"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # Hay deuda histórica de formato. No se reescribe masivamente código financiero:
      # todo archivo PHP nuevo/modificado sí queda obligado a cumplir Pint.
      - name: Pint en PHP modificado
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mapfile -t PHP_FILES < <(git diff --diff-filter=ACMR --name-only "$BASE" HEAD -- '*.php')
          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "Sin archivos PHP modificados."
            exit 0
          fi
          printf 'Verificando %s archivo(s) PHP con Pint.\n' "${#PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      # Mismo criterio para Prettier: impide deuda nueva sin reformatear cientos
      # de archivos históricos en un commit cosmético.
      - name: Prettier en frontend modificado
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          mapfile -t FRONT_FILES < <(
            git diff --diff-filter=ACMR --name-only "$BASE" HEAD -- resources/ |
            awk '/\.(vue|js|mjs|cjs|ts|tsx|css|scss|json|md)$/'
          )
          if (( ${#FRONT_FILES[@]} == 0 )); then
            echo "Sin archivos frontend modificados."
            exit 0
          fi
          printf 'Verificando %s archivo(s) frontend con Prettier.\n' "${#FRONT_FILES[@]}"
          npx prettier --check "${FRONT_FILES[@]}"

      - name: Auditoría de dependencias Node de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Frontend completo
        run: npm run lint:check

      - name: Typecheck Frontend completo
        run: npm run types:check
