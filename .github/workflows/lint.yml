name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      # El repositorio arrastra formato PHP histórico anterior a este gate. No se
      # reescriben cientos de archivos financieros en un commit cosmético: desde aquí,
      # todo PHP nuevo/modificado sí debe cumplir Pint sin que CI modifique nada.
      - name: Pint en PHP modificado (sin modificar)
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE_PUSH: ${{ github.event.before }}
        run: |
          if [[ "$EVENTO" == "pull_request" ]]; then
            BASE="$BASE_PR"
          else
            BASE="$BEFORE_PUSH"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t PHP_FILES < <(git diff --diff-filter=ACMR --name-only "$BASE" HEAD -- '*.php')
          if (( ${#PHP_FILES[@]} == 0 )); then
            echo "Sin archivos PHP modificados."
            exit 0
          fi
          printf 'Verificando %s archivo(s) PHP con Pint.\n' "${#PHP_FILES[@]}"
          vendor/bin/pint --test "${PHP_FILES[@]}"

      # Igual que PHP: existe deuda histórica de Prettier. Se bloquea cualquier
      # archivo frontend nuevo/modificado que no venga formateado, sin reescribir el repo.
      - name: Formato de frontend modificado (sin modificar)
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BEFORE_PUSH: ${{ github.event.before }}
        run: |
          if [[ "$EVENTO" == "pull_request" ]]; then
            BASE="$BASE_PR"
          else
            BASE="$BEFORE_PUSH"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t FRONT_FILES < <(
            git diff --diff-filter=ACMR --name-only "$BASE" HEAD -- resources/               | grep -E '\.(vue|js|mjs|cjs|ts|tsx|css|scss|json|md)      - name: Lint Frontend (sin modificar)
        run: npm run lint:check

      - name: Typecheck Frontend
        run: npm run types:check

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
 || true
          )
          if (( ${#FRONT_FILES[@]} == 0 )); then
            echo "Sin archivos frontend modificados."
            exit 0
          fi
          printf 'Verificando %s archivo(s) frontend con Prettier.\n' "${#FRONT_FILES[@]}"
          npx prettier --check "${FRONT_FILES[@]}"

      - name: Auditoría de dependencias Node de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Lint Frontend (sin modificar)
        run: npm run lint:check

      - name: Typecheck Frontend
        run: npm run types:check

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
