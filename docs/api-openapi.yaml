openapi: 3.0.3
info:
  title: Reportería MR Lana — API general (v1)
  description: >
    API de solo lectura, servidor a servidor, para consumir los indicadores ya
    calculados por el sistema de Reportería. Nunca recalcula fórmulas
    financieras: toda métrica proviene de la misma fuente que usan Web, Excel,
    PDF y OKR (RadiografiaExportService::buildSnapshot). Ver docs/api-reporteria.md.
  version: "1.0.0"
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: health
  - name: capabilities
  - name: branches
  - name: employees
  - name: periods
  - name: financial
  - name: collections
  - name: okr
  - name: exports
    description: Exportación de KPIs por periodo (colaboradores, sucursales, corporativo, consolidado)

paths:
  /health:
    get:
      tags: [health]
      summary: Salud del servicio, sin autenticación ni exposición sensible
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: reportes-api }
                  version: { type: string, example: v1 }
                  time: { type: string, format: date-time }

  /capabilities:
    get:
      tags: [capabilities]
      summary: Funciones y versiones disponibles para el consumidor autenticado
      description: >
        Fase 2.8 — cada recurso en `resources` trae tres campos: `implemented` (verdad del
        sistema), `permitted` (si ESTE consumidor puede usarlo ahora) y `blocked_reason`
        (razón explícita cuando `implemented=false`, nunca un booleano sin contexto).
        El bloque ADITIVO `features` anuncia capacidades del contrato sin mover `api_version`:
        `features.route_branch_mapping === true` (equivalente: `resources.branches.sucursal_attribution`)
        indica que /branches, /employees y financial-summary ya traen la atribución a sucursal.
        Si falta (contrato anterior), el consumidor debe degradar tratando la sucursal como desconocida.
      responses:
        "200":
          description: OK
        "401": { $ref: "#/components/responses/Unauthorized" }

  /branches:
    get:
      tags: [branches]
      summary: Catálogo de sucursales/rutas operativas activas
      description: >
        `branches` son las **sucursales/rutas operativas** de Reportería (una fila por
        oficina/ruta), NO el catálogo institucional de las 11 sucursales de OKR. La
        atribución a una de esas 11 viaja en el campo ADITIVO `sucursal` (una `SucursalRef`
        o `null` cuando la ruta no es atribuible a ninguna de las 11 — honesto, nunca
        inventado). `active` es el estado operativo DERIVADO (combina `is_active` del branch
        con la bandera de la ruta en el catálogo oficial). Las claves originales
        `{id, code, name}` y `meta` se conservan sin cambios (retro-compatibilidad).
      parameters:
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedBranches" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /employees:
    get:
      tags: [employees]
      summary: Colaboradores paginados
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: branch_id
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedEmployees" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /employees/{employeeId}:
    get:
      tags: [employees]
      summary: Identificación del colaborador
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /employees/{employeeId}/financial-summary:
    get:
      tags: [employees]
      summary: Ficha financiera atribuible del colaborador para un periodo
      description: >
        Requiere AMBAS abilities `employees.read` Y `financial.read` (corrección Fase 2.1 —
        tener acceso al catálogo de empleados nunca basta por sí solo). La autorización se
        verifica contra la sucursal HISTÓRICA del colaborador en `period_id`, nunca su
        asignación más reciente (Fase 2.2/2.3).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee_id: { type: integer }
                  period_id: { type: integer }
                  branch_id:
                    type: integer
                    nullable: true
                    description: >
                      Sucursal/ruta operativa (branch) registrada para el colaborador en ESE
                      periodo (foto histórica), nunca su asignación más reciente.
                  branch_status: { type: string, enum: [known, unknown] }
                  sucursal_id:
                    type: integer
                    nullable: true
                    description: >
                      ADITIVO. Id de la sucursal institucional (una de las 11 de OKR) del
                      branch del periodo. `null` cuando el branch es desconocido o no mapea a
                      ninguna de las 11. Histórico: un cambio de ruta dentro de la misma
                      sucursal conserva el mismo `sucursal_id`.
                  sucursal_status: { type: string, enum: [known, unknown] }
                  metrics:
                    type: array
                    items: { $ref: "#/components/schemas/MetricValue" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /periods:
    get:
      tags: [periods]
      summary: Periodos disponibles y su cobertura
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - in: query
          name: type
          schema: { type: string, enum: [weekly, monthly, bimonthly, quarterly, semiannual, annual] }
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /periods/{periodId}:
    get:
      tags: [periods]
      summary: Metadatos de un periodo
      parameters:
        - $ref: "#/components/parameters/PeriodIdPath"
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /periods/{periodId}/employees:
    get:
      tags: [exports]
      summary: Colaboradores del periodo con sucursal, rutas, estado laboral y KPIs
      description: >
        Una fila por colaborador CANÓNICO (registros Employee duplicados fusionados, igual que el
        reporte). Misma fuente que el "Excel de colaboradores" del reporte mensual
        (EmployeesHistoricoExportService): mismas cifras de recuperación, colocación, cartera,
        vencida, mora, OPEX, Nómina y Capital Humano, percepciones/deducciones NOI, ingreso base,
        EBITDA y margen. La sucursal es la asignación HISTÓRICA del periodo; la sucursal
        institucional sale de branches.sucursal_id. Requiere `employees.read` Y `financial.read`.
        Sin radiografía vigente → `status: not_available` y `data: []` (nunca ceros).
      parameters:
        - $ref: "#/components/parameters/PeriodIdPath"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/BranchIdQuery"
        - $ref: "#/components/parameters/SucursalIdQuery"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: OK (JSON paginado, o CSV con todas las filas si format=csv)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodEmployeesResponse" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /employees/{employeeId}/periods:
    get:
      tags: [exports]
      summary: Un colaborador a lo largo de varios periodos (con su sucursal/ruta de cada periodo)
      description: >
        Cada elemento de `data` es un periodo con `status` ok | not_available (sin radiografía) |
        not_found (sin actividad ese periodo) | forbidden (fuera del alcance de sucursal del
        consumidor para ESE periodo). Incluye `kpis.collections_effectiveness` (misma función que
        la vista de colaborador del reporte) salvo `include_effectiveness=0`. Máximo 24 periodos.
        403 si un consumidor restringido no tiene acceso en ninguno de los periodos.
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/PeriodIds"
        - $ref: "#/components/parameters/FromPeriodId"
        - $ref: "#/components/parameters/ToPeriodId"
        - in: query
          name: include_effectiveness
          schema: { type: string, enum: ["0", "1"], default: "1" }
        - $ref: "#/components/parameters/Format"
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /periods/{periodId}/branches:
    get:
      tags: [exports]
      summary: Sucursales + CORPORATIVO + CONSOLIDADO del periodo, con todos sus KPIs
      description: >
        Lee el snapshot GENERAL del reporte (RadiografiaExportService::buildSnapshot) — nunca
        recalcula. `data` = sucursales financieras del reporte (BranchRadiographyCalculator) con
        colocación, recuperación (componentes y exclusiones), cartera/mora por bucket, gastos ERP/
        Lendus/OPEX, Nómina y Capital Humano (desglose), comisiones, fondeo, excedentes, seguros,
        EBITDA/margen/categoría y rotación. `corporate` = nómina sin sucursal operativa
        (Corporativo/sin asignar) + excedentes recibidos; `consolidated` = cifras de portada del
        reporte. `reconciliation` comprueba Σ sucursales + corporativo = consolidado. Un consumidor
        restringido solo ve sus sucursales; `corporate`/`consolidated` → `status: not_authorized`.
        Requiere `financial.read`.
      parameters:
        - $ref: "#/components/parameters/PeriodIdPath"
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodBranchesResponse" }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /periods/{periodId}/export:
    get:
      tags: [exports]
      summary: Todo el periodo en una sola llamada (sucursales + corporativo + consolidado + colaboradores)
      description: >
        `financial.read` + límite `api-exports`. El bloque `employees` exige además
        `employees.read` (403 si falta; usa `include=branches`). `employees.unidentified` lista las
        filas del reporte sin identidad de colaborador (solo alcance global).
      parameters:
        - $ref: "#/components/parameters/PeriodIdPath"
        - $ref: "#/components/parameters/Include"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeriodExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /periods/export:
    get:
      tags: [exports]
      summary: Exportación de un RANGO de periodos (máx. 12)
      description: >
        `periods[]` con la misma forma que /periods/{id}/export. `format=csv` exige
        `dataset=employees|branches` y devuelve filas planas con `period_id`/`period_label`.
      parameters:
        - $ref: "#/components/parameters/PeriodIds"
        - $ref: "#/components/parameters/FromPeriodId"
        - $ref: "#/components/parameters/ToPeriodId"
        - $ref: "#/components/parameters/Include"
        - $ref: "#/components/parameters/Format"
        - in: query
          name: dataset
          schema: { type: string, enum: [employees, branches] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items: { $ref: "#/components/schemas/PeriodExport" }
                  meta:
                    type: object
                    properties:
                      periods_count: { type: integer }
                      include: { type: array, items: { type: string } }
                      definition_version: { type: string }
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /financial/summary:
    get:
      tags: [financial]
      summary: Indicadores financieros (general, por sucursal o por colaborador vía query)
      parameters:
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
        - $ref: "#/components/parameters/ScopeQuery"
        - $ref: "#/components/parameters/BranchIdQuery"
        - $ref: "#/components/parameters/EmployeeIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_id: { type: integer }
                  scope: { $ref: "#/components/schemas/Scope" }
                  metrics:
                    type: array
                    items: { $ref: "#/components/schemas/MetricValue" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /financial/branches/{branchId}:
    get:
      tags: [financial]
      summary: Indicadores financieros de una sucursal
      parameters:
        - $ref: "#/components/parameters/BranchIdPath"
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }

  /financial/employees/{employeeId}:
    get:
      tags: [financial]
      summary: Indicadores atribuibles a un colaborador/gestor
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }

  /financial/metrics:
    get:
      tags: [financial]
      summary: Catálogo de indicadores y definiciones (estable, versionado)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MetricDefinition" }

  /financial/metric-values:
    get:
      tags: [financial]
      summary: Valores filtrados por periodo, alcance y lista explícita de métricas
      parameters:
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
        - $ref: "#/components/parameters/ScopeQuery"
        - $ref: "#/components/parameters/BranchIdQuery"
        - $ref: "#/components/parameters/EmployeeIdQuery"
        - in: query
          name: metrics
          required: true
          schema: { type: string, example: "ebitda,mora,portfolio_total" }
          description: Lista separada por comas de codes de /financial/metrics
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }

  /collections/effectiveness:
    get:
      tags: [collections]
      summary: Efectividad de cobranza, distinguiendo versión histórica vs "Aprobada" (real, por periodo/alcance)
      parameters:
        - $ref: "#/components/parameters/PeriodIdQueryRequired"
        - $ref: "#/components/parameters/ScopeQuery"
        - $ref: "#/components/parameters/BranchIdQuery"
        - $ref: "#/components/parameters/EmployeeIdQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  period_id: { type: integer }
                  scope: { $ref: "#/components/schemas/Scope" }
                  versions:
                    type: object
                    properties:
                      legacy: { $ref: "#/components/schemas/MetricValue" }
                      approved:
                        type: object
                        description: >
                          Efectividad de Cobranza V4 (motor mrlana-v4-2026-10). Nunca se
                          recalcula en vivo: lee la última ejecución V4 SEMANAL exitosa del
                          period_id (semanal) y alcance exactos, generada desde el módulo web.
                          Si las fotografías o los Ingresos cambiaron después de generarla,
                          status=stale (nunca ok). Una ejecución de la calculadora anterior
                          nunca se entrega como vigente. Por colaborador exige asignación de
                          sucursal verificada en el periodo y exactamente una fila con su
                          nombre (homónimos → not_attributable).
                        properties:
                          available: { type: boolean, example: true }
                          status: { type: string, enum: [ok, stale, not_available, not_attributable, not_supported_period], example: ok }
                          is_stale: { type: boolean, example: false }
                          reason: { type: string, description: "Presente solo cuando available=false." }
                          run_id: { type: integer, nullable: true }
                          generated_at: { type: string, format: date-time, nullable: true }
                          coverage: { type: object, description: "Fotografías y movimientos de Ingresos leídos." }
                          parameters: { type: object, nullable: true, description: "modo, domingo_base, fecha_corte, inicio_ingresos, fin_ingresos." }
                          incidents: { type: object, nullable: true, description: "count y by_code (bitácora _AUDITORIA_EFECTIVIDAD)." }
                          summary: { type: object, nullable: true, description: "Fila GRAN TOTAL (solo scope=general/branch)." }
                          rows: { type: array, items: { type: object }, description: "Filas A-M (promotores, totales por oficina, GRAN TOTAL)." }
                          row: { type: object, nullable: true, description: "Fila del promotor resuelto (solo scope=employee)." }
                          engine_version: { type: string, example: mrlana-v4-2026-10 }
                          version: { type: string, example: approved_snapshot_v4 }

  /okr/summary:
    get:
      tags: [okr]
      summary: Indicadores OKR autorizados (resumen agregado)
      responses:
        "200": { description: OK }

  /okr/employees/{employeeId}:
    get:
      tags: [okr]
      summary: Cumplimiento OKR del colaborador autorizado
      parameters:
        - $ref: "#/components/parameters/EmployeeIdPath"
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "Sanctum personal access token"

  parameters:
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, maximum: 100, default: 50 }
    ScopeQuery:
      in: query
      name: scope
      schema: { type: string, enum: [general, branch, employee], default: general }
    BranchIdQuery:
      in: query
      name: branch_id
      schema: { type: integer }
    EmployeeIdQuery:
      in: query
      name: employee_id
      schema: { type: integer }
    PeriodIdQueryRequired:
      in: query
      name: period_id
      required: true
      schema: { type: integer }
    EmployeeIdPath:
      in: path
      name: employeeId
      required: true
      schema: { type: integer }
    PeriodIdPath:
      in: path
      name: periodId
      required: true
      schema: { type: integer }
    BranchIdPath:
      in: path
      name: branchId
      required: true
      schema: { type: integer }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    SucursalIdQuery:
      in: query
      name: sucursal_id
      description: Filtra por sucursal institucional (una de las 11) de la asignación del periodo.
      schema: { type: integer }
    Format:
      in: query
      name: format
      schema: { type: string, enum: [json, csv], default: json }
      description: >
        csv = UTF-8 con BOM, columnas con ruta "a.b.c"; listas anidadas como JSON en una celda.
        Se omiten las listas de detalle voluminosas (opex.items, placement.by_product).
    PeriodIds:
      in: query
      name: period_ids
      description: Lista explícita de periodos (excluyente con from/to).
      schema: { type: string, example: "19,20,21" }
    FromPeriodId:
      in: query
      name: from_period_id
      description: Inicio del rango (mismo tipo que to_period_id).
      schema: { type: integer }
    ToPeriodId:
      in: query
      name: to_period_id
      schema: { type: integer }
    Include:
      in: query
      name: include
      schema: { type: string, default: "branches,employees", example: branches }

  schemas:
    Scope:
      type: object
      properties:
        type: { type: string, enum: [general, branch, employee] }
        branch_id: { type: integer, nullable: true }
        employee_id: { type: integer, nullable: true }
    MetricValue:
      type: object
      properties:
        metric: { type: string, example: ebitda }
        period_id: { type: integer }
        period_type: { type: string }
        period_label: { type: string }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        calculated_at: { type: string, nullable: true }
        source: { type: string, example: reporteria.radiography_snapshot }
        status: { type: string, enum: [ok, not_available, not_attributable] }
        scope: { $ref: "#/components/schemas/Scope" }
        value: { type: number, nullable: true }
        unit: { type: string, nullable: true, example: MXN }
        definition_version: { type: string, example: v1 }
    MetricDefinition:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        unit: { type: string }
        direction: { type: string, enum: [increase, decrease, neutral] }
        scopes:
          type: array
          items: { type: string }
        source: { type: string, enum: [summary, derived, special, legacy_section] }
        definition: { type: string, nullable: true }
        definition_version: { type: string }
    SucursalRef:
      type: object
      description: >
        Referencia a una de las 11 sucursales INSTITUCIONALES de OKR (ancla estable de
        atribución). `null` donde aparece significa "no atribuible a ninguna de las 11".
      properties:
        id: { type: integer }
        codigo: { type: string, example: SAN_LUIS_POTOSI }
        nombre: { type: string, example: SAN LUIS POTOSI }
    BranchRef:
      type: object
      description: Referencia a una sucursal/ruta operativa (branch), no a una de las 11.
      properties:
        id: { type: integer }
        code: { type: string, nullable: true }
        name: { type: string }
    Employee:
      type: object
      properties:
        id: { type: integer }
        employee_code: { type: string, nullable: true }
        full_name: { type: string }
        position: { type: string, nullable: true }
        is_active: { type: boolean }
        branch_id:
          type: integer
          nullable: true
          description: Branch (ruta/sucursal operativa) actual del colaborador, solo identificación.
        branch:
          allOf: [{ $ref: "#/components/schemas/BranchRef" }]
          nullable: true
          description: ADITIVO. Branch actual resuelto desde `branch_id`, o `null`.
        sucursal:
          allOf: [{ $ref: "#/components/schemas/SucursalRef" }]
          nullable: true
          description: >
            ADITIVO. Sucursal institucional del branch actual (tomada de la relación real
            branches.sucursal_id, JAMÁS inferida del nombre). `null` si no es atribuible.
        region: { type: string, nullable: true, description: "ADITIVO. Región de la sucursal (p. ej. Q1/Q3), o null." }
    PaginatedEmployees:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
    PaginatedBranches:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: string, nullable: true }
              name: { type: string }
              sucursal:
                allOf: [{ $ref: "#/components/schemas/SucursalRef" }]
                nullable: true
                description: ADITIVO. Sucursal institucional (una de las 11) atribuida a este branch/ruta, o null.
              region: { type: string, nullable: true, description: "ADITIVO. Región de la sucursal atribuida, o null." }
              active:
                type: boolean
                description: >
                  ADITIVO. Estado operativo DERIVADO (Branch::derivedActive): false si el
                  branch está inactivo o si su ruta está marcada inactiva en el catálogo.
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
    PeriodRef:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        type: { type: string }
        label: { type: string, example: Junio 2026 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_closed: { type: boolean }
    EmployeeRoute:
      type: object
      properties:
        route: { type: string, description: Nombre tal como viene en la fuente }
        catalog_route: { type: string, nullable: true, description: Ruta del catálogo oficial (BranchRouteCatalog) o null si es desconocida }
        catalog_branch: { type: string, nullable: true, description: Sucursal oficial a la que pertenece la ruta }
        active: { type: boolean, nullable: true }
        sources:
          type: array
          items: { type: string, enum: [assignment, portfolio] }
        contracts: { type: integer, nullable: true, description: Contratos de cartera del gestor en esa ruta (periodo) }
        balance: { type: number, nullable: true }
    EmployeePeriodKpis:
      type: object
      description: Fila colaborador × periodo. Montos en MXN, porcentajes en %.
      properties:
        employee:
          type: object
          properties:
            id: { type: integer, description: Id canónico (el menor del grupo fusionado) }
            employee_ids: { type: array, items: { type: integer } }
            full_name: { type: string }
            report_name: { type: string, description: Nombre exacto con el que aparece en el reporte }
            employee_code: { type: string, nullable: true, description: Clave NOI del id canónico }
            employee_codes: { type: array, items: { type: string } }
            promoter_code: { type: string, nullable: true, description: Código de promotor Lendus }
            position: { type: string, nullable: true }
            is_active: { type: boolean, nullable: true }
        branch_id: { type: integer, nullable: true }
        branch: { allOf: [{ $ref: "#/components/schemas/BranchRef" }], nullable: true }
        branch_status: { type: string, enum: [known, unknown], description: known = existe asignación para ESE periodo }
        branch_source: { type: string, nullable: true, enum: [assignment, report_row] }
        assigned_branch_id: { type: integer, nullable: true, description: Fuente de autorización (asignación del periodo) }
        sucursal: { allOf: [{ $ref: "#/components/schemas/SucursalRef" }], nullable: true }
        region: { type: string, nullable: true }
        report_branch_name: { type: string, nullable: true, description: Sucursal que muestra el reporte para la fila }
        routes: { type: array, items: { $ref: "#/components/schemas/EmployeeRoute" } }
        employment:
          type: object
          properties:
            operational_status: { type: string, enum: [ACTIVO, BAJA], description: Misma regla que el Excel (ingreso real u OPEX automático > 0) }
            roster_status: { type: string, nullable: true, description: "RosterMovementStatus (alta_confirmada, activo_confirmado, baja_confirmada, posible_baja, ...)" }
            roster_status_label: { type: string, nullable: true }
            movement_type: { type: string, nullable: true, enum: [alta, activo, baja, ausencia, sin_cambio] }
            is_active_for_period: { type: boolean, nullable: true }
            requires_review: { type: boolean, nullable: true }
            roster_available: { type: boolean }
        kpis:
          type: object
          properties:
            placement: { type: object, description: "amount, operations, by_product[]" }
            recovery: { type: object, description: "total (con exclusiones del reporte) y components{capital, interest, tax, late_charges, ...}" }
            portfolio: { type: object, description: "total, overdue, current, mora_pct, buckets{al_corriente, mora_1_30, ...}" }
            payroll: { type: object, description: "human_capital_total (usado en EBITDA), payments, bonuses, discounts, noi_perceptions, noi_deductions, noi_net_paid, concepts{sueldo, comisiones, bonos, ...}, deductions_detail[]" }
            commissions: { type: number, description: Percepciones NOI de comisiones (P002/P119) }
            opex: { type: object, description: "automatic_total, opex_pure, employee_payroll_expenses, manual (=0, la API es oficial), total, items[]" }
            ebitda: { type: object, description: "income_base, total_expenses, ebitda, margin_pct, category" }
            collections_effectiveness: { type: object, nullable: true, description: "Solo en /employees/{id}/periods" }
        availability: { type: object, description: Explicación de cada dato null }
    PeriodEmployeesResponse:
      type: object
      properties:
        period: { $ref: "#/components/schemas/PeriodRef" }
        status: { type: string, enum: [ok, not_available] }
        message: { type: string, nullable: true }
        source: { type: string, example: reporteria.employees_period_kpis }
        definition_version: { type: string }
        calculated_at: { type: string, nullable: true }
        radiography_version: { type: integer, nullable: true, description: id del PeriodSummary vigente usado }
        data: { type: array, items: { $ref: "#/components/schemas/EmployeePeriodKpis" } }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }
            unidentified_count: { type: integer, nullable: true }
    BranchPeriodKpis:
      type: object
      properties:
        name: { type: string, example: TULA }
        branch_id: { type: integer, nullable: true }
        branch: { allOf: [{ $ref: "#/components/schemas/BranchRef" }], nullable: true }
        sucursal: { allOf: [{ $ref: "#/components/schemas/SucursalRef" }], nullable: true }
        region: { type: string, nullable: true }
        routes: { type: array, items: { type: object, properties: { route: { type: string }, active: { type: boolean } } } }
        kpis:
          type: object
          description: >
            placement{amount, credits}, recovery{total, gross, components, excluded}, portfolio{total,
            contracts, overdue, current, mora_pct, buckets}, expenses{opex_total, erp, lendus, *_loaded,
            *_excluded_*, by_concept}, payroll{human_capital_total, breakdown, imss_employer,
            employee_expenses, deductions_informative, noi_*}, commissions, funding{interbranch_loans,
            surplus_sent_to_corporate}, insurance{lendus_bridge, crece_policies_30,
            crece_comadres_informative}, ebitda{income_base, total_expenses, ebitda, margin_pct,
            category}, turnover_pct, collections_effectiveness (null por sucursal: usar
            /financial/branches/{id}).
    PeriodBranchesResponse:
      type: object
      properties:
        period: { $ref: "#/components/schemas/PeriodRef" }
        status: { type: string, enum: [ok, not_available] }
        message: { type: string, nullable: true }
        source: { type: string, example: reporteria.radiography_snapshot }
        calculated_at: { type: string, nullable: true }
        data: { type: array, items: { $ref: "#/components/schemas/BranchPeriodKpis" } }
        corporate: { type: object, nullable: true, description: "payroll{human_capital_total, breakdown, employees[]}, expenses, imss_excluded_informative, surplus_received, ebitda_contribution, availability — o {status: not_authorized}" }
        consolidated: { type: object, nullable: true, description: "name, cash{opening_balance, closing_balance}, kpis (mismas claves que una sucursal + turnover_pct, collections_effectiveness) — o {status: not_authorized}" }
        reconciliation: { type: object, nullable: true }
    PeriodExport:
      type: object
      properties:
        period: { $ref: "#/components/schemas/PeriodRef" }
        branches:
          type: object
          description: Misma forma que PeriodBranchesResponse (sin `period`)
        employees:
          type: object
          properties:
            status: { type: string }
            message: { type: string, nullable: true }
            calculated_at: { type: string, nullable: true }
            radiography_version: { type: integer, nullable: true }
            total: { type: integer }
            data: { type: array, items: { $ref: "#/components/schemas/EmployeePeriodKpis" } }
            unidentified: { type: array, nullable: true, items: { type: object } }
    Error:
      type: object
      properties:
        message: { type: string }

  responses:
    Unauthorized:
      description: Sin token válido
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    Forbidden:
      description: Sin la ability requerida, consumidor inactivo, o fuera de su alcance de sucursal
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    NotFound:
      description: Recurso no encontrado
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
    UnprocessableEntity:
      description: Parámetros inválidos o faltantes
      content:
        application/json: { schema: { $ref: "#/components/schemas/Error" } }
